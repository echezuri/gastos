<!doctype html>
<html lang="es-AR">
  <head>
    <base target="_top" />
    <meta charset="utf-8" />
    <title>Gastos</title>
    <style>
/* El atributo hidden tiene que ganar siempre. Sin esto cualquier regla con `display`
   (`.field`, `.subtabs`…) lo pisa y el elemento se ve igual: así se estaba mostrando el
   campo de cotización con la carga en pesos. */
[hidden] {
  display: none !important;
}

:root {
  --bg: #f6f5f2;
  --panel: #ffffff;
  --ink: #1b1a17;
  --ink-soft: #6b6862;
  --line: #e3e0d9;
  --line-strong: #cfcabf;
  --accent: #1f6f5c;
  --accent-soft: #e6f0ec;
  --neg: #b23a2e;
  --pos: #1f6f5c;
  --row-hover: #faf9f6;
  --shadow: 0 1px 2px rgba(27, 26, 23, 0.06), 0 8px 24px rgba(27, 26, 23, 0.05);
  --radius: 10px;
  --mono: ui-monospace, "SFMono-Regular", "Cascadia Mono", "Segoe UI Mono", Menlo, monospace;

  /* Tonos suaves para los números del resumen */
  --ink-income: #3f8570;
  --ink-expense: #9c665e;

  /* Marcas de los gráficos (validadas contra estas superficies) */
  --chart-income: #1baf7a;
  --chart-expense: #e34948;
  --chart-neutral: #2a78d6;
  /* Tercer tono, para separar las tres secciones de gasto en un mismo gráfico. Ámbar:
     se distingue del rojo y del azul también sin ver el color. */
  --chart-warm: #d08c1c;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16171a;
    --panel: #1e2024;
    --ink: #eceae5;
    --ink-soft: #9a978f;
    --line: #2c2f34;
    --line-strong: #3a3e45;
    --accent: #57bfa0;
    --accent-soft: #1d2b28;
    --neg: #e8776a;
    --pos: #57bfa0;
    --row-hover: #24262b;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);

    --ink-income: #7cc0a9;
    --ink-expense: #cf958d;

    --chart-income: #199e70;
    --chart-expense: #e66767;
    --chart-neutral: #3987e5;
    --chart-warm: #d99f36;
  }
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

/* ---------- barra superior ---------- */

.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  background: color-mix(in srgb, var(--panel) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
}

.topbar-row {
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 10px 18px;
}

.subtabs {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 0 14px 7px;
  overflow-x: auto;
  scrollbar-width: none;
}

.subtabs::-webkit-scrollbar {
  display: none;
}

.subtab {
  display: flex;
  align-items: center;
  gap: 6px;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  color: var(--ink-soft);
  font: inherit;
  font-size: 13.5px;
  white-space: nowrap;
  padding: 5px 10px 6px;
  border-radius: 6px 6px 0 0;
  cursor: pointer;
}

.subtab:hover {
  color: var(--ink);
  background: var(--row-hover);
}

.subtab.is-active {
  color: var(--accent);
  border-bottom-color: var(--accent);
  font-weight: 600;
}

.badge {
  background: #d08c1c;
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  padding: 3px 6px;
  border-radius: 999px;
}

/* ---------- tarjetas de resumen ---------- */

.kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
  margin-bottom: 16px;
}

.kpi {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 11px 15px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  text-align: left;
}

.kpi-label {
  font-size: 11px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.kpi-value {
  font-size: 21px;
  font-weight: 650;
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}

.kpi-sub {
  font-size: 12px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.kpi.is-pos .kpi-value {
  color: var(--pos);
}

.kpi.is-neg .kpi-value {
  color: var(--neg);
}

.kpi-button {
  font: inherit;
  color: inherit;
  cursor: pointer;
}

.kpi.is-pending {
  border-color: #d08c1c;
}

.kpi.is-pending .kpi-value,
.kpi.is-pending .kpi-label {
  color: #d08c1c;
}

.kpi-button:hover {
  border-color: var(--accent);
}

.brand {
  display: flex;
  align-items: center;
  gap: 9px;
}

.brand h1 {
  margin: 0;
  font-size: 17px;
  letter-spacing: -0.01em;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: var(--accent);
  color: #fff;
  font-weight: 700;
  font-size: 15px;
}

.tabs {
  display: flex;
  gap: 2px;
  padding: 3px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 999px;
}

.tab {
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  font: inherit;
  font-size: 14px;
  padding: 5px 14px;
  border-radius: 999px;
  cursor: pointer;
}

.tab.is-active {
  background: var(--panel);
  color: var(--ink);
  box-shadow: var(--shadow);
}

.topbar-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 8px;
}

select,
.btn {
  font: inherit;
  font-size: 14px;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line-strong);
  border-radius: 8px;
  padding: 5px 11px;
  cursor: pointer;
  text-decoration: none;
}

.btn:hover,
select:hover {
  border-color: var(--accent);
}

.btn-ghost {
  background: transparent;
}

.btn-accent {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}

.btn-accent:hover {
  filter: brightness(1.08);
}

.btn-small {
  padding: 3px 9px;
  font-size: 12.5px;
}

/* ---------- layout ---------- */

main {
  padding: 20px 18px 80px;
  max-width: 1500px;
  margin: 0 auto;
}

.loading {
  color: var(--ink-soft);
}

.falla {
  background: var(--panel);
  border: 1px solid var(--neg);
  border-radius: var(--radius);
  padding: 18px 20px;
  max-width: 720px;
}

.falla h2 {
  margin: 0 0 8px;
  font-size: 16px;
  color: var(--neg);
}

.falla p {
  margin: 0 0 10px;
  font-size: 14px;
}

.falla pre {
  margin: 0;
  padding: 10px;
  background: var(--bg);
  border-radius: 8px;
  font-size: 12px;
  color: var(--ink-soft);
  white-space: pre-wrap;
  overflow-x: auto;
}

.panel {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  margin-bottom: 18px;
  /* clip y no hidden: recorta las esquinas redondeadas sin romper el encabezado
     pegajoso de la tabla (hidden lo dejaría anclado al panel en vez de a la pantalla) */
  overflow: clip;
}

.panel-head {
  display: flex;
  align-items: baseline;
  gap: 10px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--line);
}

.panel-head h2 {
  margin: 0;
  font-size: 13px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.panel-head .hint {
  font-size: 12.5px;
  color: var(--ink-soft);
}

.panel-head .spacer {
  margin-left: auto;
}

/* La tabla se muestra entera: no scrollea por dentro, así no aparece ninguna barra.
   Si es larga, scrollea la página, y el encabezado queda pegado abajo de la barra
   superior. A lo ancho nunca desborda porque las columnas se reparten el espacio. */
.scroll-x {
  overflow: visible;
}

/* ---------- tablas ---------- */

/* Ancho fijo: las columnas se reparten el espacio disponible en vez de empujar la
   tabla a lo ancho. Lo que no entra se recorta con puntos suspensivos, nunca scrollea. */
table {
  border-collapse: collapse;
  table-layout: fixed;
  width: 100%;
  font-variant-numeric: tabular-nums;
}

.cell-input,
.label-input,
.desc-input,
.row-link,
.plain-label {
  min-width: 0;
  text-overflow: ellipsis;
  overflow: hidden;
  white-space: nowrap;
}

th,
td {
  border-bottom: 1px solid var(--line);
  padding: 0;
  text-align: right;
  white-space: nowrap;
}

thead th {
  position: sticky;
  top: var(--topbar-h, 78px);
  background: var(--panel);
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding: 7px 7px;
  z-index: 2;
}

tbody tr:hover {
  background: var(--row-hover);
}

.col-label {
  text-align: left;
  position: sticky;
  left: 0;
  background: var(--panel);
  z-index: 1;
  width: 200px;
  border-right: 1px solid var(--line);
}

tbody tr:hover .col-label {
  background: var(--row-hover);
}

thead .col-label {
  z-index: 3;
}

.cell-input,
.label-input {
  width: 100%;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  padding: 6px 7px;
  text-align: right;
  border-radius: 4px;
}

.label-input {
  text-align: left;
  font-size: 13.5px;
  letter-spacing: 0.02em;
}

.cell-input:focus,
.label-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  background: var(--accent-soft);
}

.cell-input.is-empty {
  color: transparent;
}

.cell-input:hover {
  background: var(--accent-soft);
}

.label-cell {
  display: flex;
  align-items: center;
  gap: 2px;
  position: relative;
}

/* Los botones de la fila flotan sobre el nombre y sólo aparecen al pasar el mouse:
   así el nombre completo de la categoría dispone de todo el ancho de la columna. */
.row-actions {
  display: flex;
  gap: 1px;
  opacity: 0;
  position: absolute;
  right: 2px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--row-hover);
  border-radius: 6px;
  padding: 2px 2px 2px 6px;
}

tr:hover .row-actions,
.row-actions:focus-within {
  opacity: 1;
}

.icon-btn {
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  cursor: pointer;
  font-size: 12px;
  line-height: 1;
  padding: 3px 4px;
  border-radius: 4px;
}

.icon-btn:hover {
  background: var(--line);
  color: var(--ink);
}

.icon-btn.danger:hover {
  background: var(--neg);
  color: #fff;
}

td.num {
  padding: 6px 7px;
  font-size: 13px;
  overflow: hidden;
  text-overflow: ellipsis;
}

.year-col {
  width: 88px;
}

/* La columna del mes en curso, para ubicarse de un vistazo */
.mes-actual {
  background: color-mix(in srgb, var(--accent) 9%, transparent);
  box-shadow: inset 1px 0 0 var(--line-strong), inset -1px 0 0 var(--line-strong);
}

thead th.mes-actual {
  color: var(--accent);
  font-weight: 700;
  background: color-mix(in srgb, var(--accent) 14%, var(--panel));
}

tbody tr:hover .mes-actual {
  background: color-mix(in srgb, var(--accent) 14%, var(--row-hover));
}

.total-row td,
tfoot td {
  font-weight: 650;
  background: color-mix(in srgb, var(--accent-soft) 60%, transparent);
  border-top: 1px solid var(--line-strong);
}

.total-row .col-label,
tfoot .col-label {
  background: color-mix(in srgb, var(--accent-soft) 60%, transparent);
  font-size: 12px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  padding: 7px 10px;
}

.year-col {
  border-left: 1px solid var(--line-strong);
  color: var(--ink-soft);
}

.neg {
  color: var(--neg);
}

.pos {
  color: var(--pos);
}

.zero {
  color: var(--ink-soft);
  opacity: 0.45;
}

.add-row td {
  padding: 6px 10px;
  text-align: left;
}

.add-input {
  border: 1px dashed var(--line-strong);
  background: transparent;
  color: var(--ink);
  font: inherit;
  font-size: 13px;
  padding: 5px 8px;
  border-radius: 6px;
  width: 220px;
}

.add-input:focus {
  outline: none;
  border-color: var(--accent);
  border-style: solid;
}

/* ---------- resumen ---------- */

.summary td.num {
  font-size: 13px;
}

/* Ingresos, gasto total y resto: un punto más grandes que el resto de las filas. */
.summary .is-key td.num,
.summary .is-key .row-link {
  font-size: 14px;
}

.summary .strong td {
  font-weight: 700;
}

.row-link {
  display: inline-block;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-weight: 650;
  font-size: 13.5px;
  text-align: left;
  padding: 7px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.row-link:hover {
  background: var(--accent-soft);
  color: var(--accent);
}

.row-link.is-static {
  cursor: default;
}

.row-link.is-static:hover {
  background: transparent;
  color: inherit;
}

/* Ingresos en verde sutil; el resto de las filas en rojo sutil, y en rojo
   fuerte los valores negativos. */
.row-income td.num {
  color: var(--ink-income);
}

.row-expense td.num {
  color: var(--ink-expense);
}

/* Ahorro y compartidos: sale plata pero no es gasto, así que va en gris */
.row-aparte td.num {
  color: var(--ink-soft);
  font-style: italic;
}

.summary td.num.neg {
  color: var(--neg);
  font-weight: 650;
}

.summary td.num.zero {
  color: var(--ink-soft);
  opacity: 0.4;
}

/* La columna % queda pegada a la derecha: es el número que se mira, aunque la
   tabla scrollee en pantallas angostas. */
.pct-col {
  position: sticky;
  right: 0;
  background: var(--panel);
  border-left: 1px solid var(--line-strong);
  color: var(--ink-soft);
  min-width: 62px;
}

.summary tbody tr:hover .pct-col {
  background: var(--row-hover);
}

.summary tbody .pct-col {
  font-size: 13px;
}

/* ---------- gráficos y estadísticas ---------- */

.insights {
  border-bottom: 1px solid var(--line);
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--line);
  border-bottom: 1px solid var(--line);
}

.stat {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 9px 15px;
  background: var(--panel);
}

.stat-label {
  font-size: 10.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.stat-value {
  font-size: 16px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.stat-sub {
  font-size: 11.5px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.stat.is-pending .stat-value {
  color: #d08c1c;
}

.chart-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 1px;
  background: var(--line);
}

@media (max-width: 940px) {
  .chart-grid {
    grid-template-columns: 1fr;
  }
}

.chart-box {
  background: var(--panel);
  padding: 10px 14px 6px;
  min-width: 0;
}

.chart-head {
  display: flex;
  align-items: baseline;
  gap: 9px;
  flex-wrap: wrap;
  margin-bottom: 2px;
}

.chart-title {
  margin: 0;
  font-size: 12px;
  letter-spacing: 0.07em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.chart-note {
  font-size: 11.5px;
  color: var(--ink-soft);
  opacity: 0.85;
}

.chart {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}

.chart-grid-line {
  stroke: var(--line);
  stroke-width: 1;
}

.chart-axis {
  fill: var(--ink-soft);
  font-size: 12px;
  font-family: inherit;
}

.chart-value,
.chart-peak {
  fill: var(--ink);
  font-size: 12px;
  font-family: inherit;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.chart-peak {
  font-size: 11.5px;
}

/* ---------- ranking en barras acostadas ---------- */

.bar-label {
  fill: var(--ink-soft);
  font-size: 12px;
  font-family: inherit;
}

.bar-value {
  fill: var(--ink);
  font-size: 12px;
  font-family: inherit;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.bar-hit {
  fill: transparent;
}

.bar-row.is-clickable {
  cursor: pointer;
}

.bar-row.is-clickable:hover .bar-hit,
.bar-row:focus-visible .bar-hit {
  fill: var(--accent-soft);
}

.bar-row:focus-visible {
  outline: none;
}

.bar-row.is-selected .bar-hit {
  fill: var(--accent-soft);
}

.bar-row.is-selected .bar-label {
  fill: var(--ink);
  font-weight: 600;
}

.chart-mark {
  transition: opacity 0.12s ease;
}

.chart-mark:hover {
  opacity: 0.78;
}

.chart-mark.is-clickable {
  cursor: pointer;
}

.chart-axis.is-selected {
  fill: var(--accent);
  font-weight: 700;
}

.chart-grid-line.is-zero {
  stroke: var(--line-strong);
}

.chart-area {
  opacity: 0.1;
}

.chart-dot {
  stroke: var(--panel);
  stroke-width: 2;
}

.chart-legend {
  display: flex;
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  color: var(--ink-soft);
}

.legend-swatch {
  width: 11px;
  height: 11px;
  border-radius: 3px;
}

.chart-tip {
  position: fixed;
  z-index: 60;
  background: var(--ink);
  color: var(--bg);
  font-size: 12.5px;
  padding: 5px 9px;
  border-radius: 6px;
  pointer-events: none;
  white-space: nowrap;
  box-shadow: var(--shadow);
}

.progress-wrap {
  padding: 10px 15px 12px;
}

.progress-head {
  display: flex;
  justify-content: space-between;
  margin-bottom: 6px;
}

.progress {
  height: 8px;
  background: var(--line);
  border-radius: 999px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 999px;
}

/* ---------- gastos variables ---------- */

.months {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
}

.month-chip {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--ink-soft);
  font: inherit;
  font-size: 12.5px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 4px 11px;
  border-radius: 999px;
  cursor: pointer;
  display: flex;
  align-items: baseline;
  gap: 6px;
}

.month-chip .chip-amount {
  font-size: 11px;
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
}

.month-chip:hover {
  border-color: var(--accent);
}

.month-chip.is-active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}

.var-table td:first-child {
  width: 160px;
}

.var-table .desc-input {
  width: 100%;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  padding: 7px 10px;
  text-align: left;
  border-radius: 4px;
}

.var-table .desc-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  background: var(--accent-soft);
}

.var-table th:nth-child(2),
.var-table td:nth-child(2) {
  text-align: left;
  width: 100%;
}

.empty {
  padding: 16px;
  color: var(--ink-soft);
  font-size: 14px;
}

/* ---------- auto / quinta ---------- */

.cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 1px;
  background: var(--line);
}

.card-field {
  background: var(--panel);
  padding: 10px 14px;
}

.card-field label {
  display: block;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 3px;
}

.card-field input {
  width: 100%;
  border: 0;
  border-bottom: 1px solid transparent;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 15px;
  padding: 2px 0;
}

.card-field input:focus {
  outline: none;
  border-bottom-color: var(--accent);
}

.rubro-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 1px;
  background: var(--line);
}

.rubro {
  background: var(--panel);
  padding: 12px 14px;
}

.rubro h3 {
  margin: 0 0 8px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.rubro h3 span {
  color: var(--accent);
  font-variant-numeric: tabular-nums;
}

.rubro ul {
  list-style: none;
  margin: 0;
  padding: 0;
}

.rubro li {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 2px 0;
  border-bottom: 1px solid var(--line);
}

.rubro li input[type='text'] {
  flex: 1;
  min-width: 0;
}

.rubro li input {
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 13.5px;
  padding: 4px 2px;
}

.rubro li input.amount {
  width: 74px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  color: var(--ink-soft);
}

.rubro li input:focus {
  outline: 1px solid var(--accent);
  border-radius: 4px;
}

.todos {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 1px;
  background: var(--line);
}

.todo-zone {
  background: var(--panel);
  padding: 12px 14px;
}

.todo-zone h3 {
  margin: 0 0 8px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.todo {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 3px 0;
}

.todo input[type='text'] {
  flex: 1;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 14px;
  padding: 3px 2px;
}

.todo input[type='text']:focus {
  outline: 1px solid var(--accent);
  border-radius: 4px;
}

.todo.done input[type='text'] {
  text-decoration: line-through;
  color: var(--ink-soft);
}

/* ---------- celdas con movimientos ---------- */

.plain-label {
  display: inline-block;
  padding: 7px 10px;
}

.cell-detail {
  width: 100%;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
  padding: 7px 10px;
  text-align: right;
  cursor: pointer;
  border-radius: 4px;
  display: flex;
  align-items: baseline;
  justify-content: flex-end;
  gap: 3px;
  text-decoration: underline;
  text-decoration-color: var(--line-strong);
  text-underline-offset: 3px;
}

.cell-detail:hover {
  background: var(--accent-soft);
  text-decoration-color: var(--accent);
}

.cell-detail.neg {
  color: var(--neg);
}

.pending-dot {
  color: #d08c1c;
  font-size: 17px;
  line-height: 0;
}

.panel-pending {
  border-color: #d08c1c;
}

.panel-pending .panel-head h2 {
  color: #d08c1c;
}

tr.is-pending {
  opacity: 0.6;
}

/* En "Nombres repetidos" cada variante es una fila: la línea separa un grupo del
   siguiente, así se ve cuáles compiten entre sí. */
tr.grupo-primero td {
  border-top: 1px solid var(--line);
}

tr.grupo-primero:first-child td {
  border-top: 0;
}

.filter-chip {
  border: 1px solid var(--accent);
  background: var(--accent-soft);
  color: var(--accent);
  font: inherit;
  font-size: 12.5px;
  padding: 3px 10px;
  border-radius: 999px;
  cursor: pointer;
}

.base-row {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--row-hover);
}

.mov-table .day-input {
  width: 52px;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  text-align: right;
  padding: 7px 10px;
  font-variant-numeric: tabular-nums;
}

.mov-table .day-input:focus,
.mov-table .desc-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: -2px;
  background: var(--accent-soft);
  border-radius: 4px;
}

.mov-table .desc-input {
  width: 100%;
  min-width: 200px;
  border: 0;
  background: transparent;
  color: inherit;
  font: inherit;
  padding: 7px 10px;
  text-align: left;
  border-radius: 4px;
}

.row-select {
  border: 1px solid transparent;
  background: transparent;
  color: inherit;
  font: inherit;
  font-size: 13.5px;
  padding: 5px 6px;
  border-radius: 6px;
  max-width: 220px;
}

.row-select:hover {
  border-color: var(--line-strong);
}

/* Anchos de la tabla de movimientos: el detalle se queda con lo que sobra. */
.mov-table th:nth-child(1) {
  width: 62px;
}

.mov-table th:nth-child(2) {
  width: 210px;
}

.mov-table th:nth-child(4) {
  width: 130px;
}

.mov-table th:nth-child(5) {
  width: 58px;
}

.mov-table th:nth-child(6) {
  width: 74px;
}

/* ---------- descripción (helptext) ---------- */

.has-note {
  text-decoration: underline dotted;
  text-decoration-color: var(--ink-soft);
  text-underline-offset: 3px;
}

.icon-btn.is-on {
  color: var(--accent);
}

.actions-cell {
  white-space: nowrap;
}

/* ---------- botón flotante (sólo teléfono) ---------- */

/* En pantalla grande el botón "+ Cargar" de la barra alcanza; el flotante taparía la
   tabla. Se enciende recién en la consulta de abajo. */
.fab {
  display: none;
}

/* ---------- formulario ---------- */

.form-mas {
  width: 100%;
  justify-content: center;
  margin-bottom: 12px;
}

.form-mas.is-open {
  margin-bottom: 8px;
}

.form-extras {
  border-top: 1px solid var(--line);
  padding-top: 14px;
}

.form-dialog {
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  background: var(--panel);
  color: var(--ink);
  padding: 20px;

  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

.form-dialog::backdrop {
  background: rgba(20, 20, 22, 0.45);
  backdrop-filter: blur(2px);
}

.form-title {
  margin: 0 0 14px;
  font-size: 15px;
  letter-spacing: 0.02em;
}

.kind-toggle {

  padding: 3px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 16px;
}

.kind-btn {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  font: inherit;
  font-size: 14px;
  padding: 7px;
  border-radius: 8px;
  cursor: pointer;
}

.kind-btn.is-active {
  background: var(--neg);
  color: #fff;
  font-weight: 600;
}

.kind-btn[data-kind='ingreso'].is-active {

.moneda-toggle {
  display: flex;
  gap: 3px;
  padding: 3px;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 14px;
}

.moneda-btn {
  flex: 1;
  border: 0;
  background: transparent;
  color: var(--ink-soft);
  font: inherit;
  font-size: 13.5px;
  padding: 6px;
  border-radius: 8px;
  cursor: pointer;
}

.moneda-btn.is-active {
  background: var(--panel);
  color: var(--ink);
  font-weight: 600;
  box-shadow: var(--shadow);
}

.cuotas-field input {
  width: 72px;
  font: inherit;
  font-size: 15px;
  color: var(--ink);
  background: var(--bg);
  border: 1px solid var(--line-strong);

  padding: 7px 9px;
}

.cuotas-field input:disabled {

#f-serie-info:not(:empty) {

.field {

  margin-bottom: 13px;
}

.field > span {
  display: block;
  font-size: 11.5px;
  letter-spacing: 0.08em;

  color: var(--ink-soft);
  margin-bottom: 4px;
}

.field-input {
  width: 100%;
  font: inherit;
  font-size: 15px;

  border: 1px solid var(--line-strong);
  border-radius: 8px;

.field-input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);

#f-amount {
  font-size: 24px;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;
}

.field-hint {

  margin-top: 4px;
  font-size: 11.5px;

.field-row {
  display: flex;
  align-items: center;

.check {

.check input[type='checkbox'] {
  width: 17px;
  height: 17px;

}

.date-field {

}

.date-field .field-input {
  width: auto;
  padding: 6px 9px;
  font-size: 14px;
}

.form-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 18px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

/* ---------- modal chico (mover de sección, pasar celdas a movimientos) ---------- */

.dialogo {
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  background: var(--panel);
  color: var(--ink);
  padding: 20px;
  width: min(420px, calc(100vw - 32px));
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
}

.dialogo::backdrop {
  background: rgba(20, 20, 22, 0.45);
  backdrop-filter: blur(2px);
}

.dialogo-titulo {
  margin: 0 0 6px;
  font-size: 15px;
}

.dialogo-hint {
  margin: 0 0 14px;
  font-size: 12.5px;
  line-height: 1.45;
  color: var(--ink-soft);
}

/* Si son muchos meses, scrollea el cuerpo y los botones quedan siempre a la vista */
.dialogo-cuerpo {
  max-height: min(52vh, 420px);
  overflow-y: auto;
}

/* Un mes por fila: la etiqueta dice cuánto es, y al lado va su subcategoría */
.field-fila {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.field-fila > span {
  margin-bottom: 0;
  text-transform: none;
  letter-spacing: 0;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.dialogo-pie {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
}

/* ---------- clave de acceso ---------- */

.login {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  background: var(--bg);
  padding: 20px;
}

.login-caja {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: min(320px, 100%);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 26px 22px;
  text-align: center;
}

.login-caja .brand-mark {
  margin: 0 auto;
  width: 40px;
  height: 40px;
  font-size: 22px;
  border-radius: 12px;
}

.login-titulo {
  margin: 0;
  font-size: 19px;
  letter-spacing: -0.01em;
}

.login-btn {
  width: 100%;
  padding: 10px;
}

.login-error {

  min-height: 18px;
  font-size: 13px;
  color: var(--neg);
}

/* ---------- estado de sincronización ---------- */

.sincro {
  border: 1px solid var(--line-strong);
  background: transparent;
  color: var(--ink-soft);
  font: inherit;
  font-size: 12.5px;
  padding: 4px 11px;
  border-radius: 999px;
  cursor: pointer;
  white-space: nowrap;
}

.sincro.is-subiendo {

  color: var(--accent);
}

.sincro.is-pendiente,

.sincro.is-sin-permiso {
  border-color: var(--neg);

}

.config-caja .field {
  text-align: left;
  margin-bottom: 10px;
}

.config-caja .field-input {
  font-size: 13.5px;
}

/* ---------- cola offline ---------- */

.aviso-cola {
  position: fixed;
  left: 50%;
  bottom: 14px;
  transform: translateX(-50%);
  z-index: 55;
  border: 1px solid #d08c1c;
  background: var(--panel);
  color: #d08c1c;
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  padding: 7px 14px;
  border-radius: 999px;
  box-shadow: var(--shadow);

}

.toast {
  position: fixed;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 13.5px;
  box-shadow: var(--shadow);

.toast.error {

  color: #fff;

/* ---------- teléfono ---------- */

@media (max-width: 700px) {
  .topbar-row {
    flex-wrap: wrap;
    gap: 10px;
    padding: 8px 12px;
  }

  .tabs {

    width: 100%;
    justify-content: space-between;

  .tab {
    flex: 1;
    text-align: center;
  }

  .topbar-right {
    gap: 6px;

  /* cargar se hace con el botón flotante: la barra de arriba queda para las solapas */
  #add-movement,
  #new-year,
  .topbar-right a.btn {
    display: none;

  .fab {
    display: grid;
    place-items: center;
    position: fixed;
    right: 18px;
    /* por encima de la barra de gestos del teléfono */
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));

    height: 58px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 30px;
    line-height: 1;
    box-shadow: 0 8px 22px rgba(0, 0, 0, 0.28);

    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  .fab:active {
    transform: scale(0.94);
  }

  main {
    padding: 12px 10px 96px;
  }

  .kpis {
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .kpi-value {
    font-size: 18px;
  }

  /* En pantalla chica una grilla de 12 meses no entra: en vez de aplastar las

  .scroll-x {

  .panel table {
    min-width: 1300px; /* para que los importes entren enteros y no queden cortados */

  .mov-table {
    min-width: 780px; /* entró la columna de descripción */
  }

  .col-label {
    width: 132px;
  }

  .chart-grid {
    grid-template-columns: 1fr;
  }

  .stats {
    grid-template-columns: 1fr 1fr;
  }

  .form-dialog {
    width: 100%;
    max-width: none;
    max-height: 100dvh;
    margin: auto 0 0;
    border-radius: 16px 16px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
  }

  #f-amount {
    font-size: 28px;
    padding: 12px;
  }

  .field-input {
    font-size: 16px; /* menos de 16px hace que el teléfono acerque el zoom solo */
    padding: 11px;
  }

  .form-actions {
    flex-wrap: wrap;
  }

  .form-actions .btn {
    flex: 1;
    padding: 11px;
  }

  .form-actions .spacer {
    display: none;
  }

         al alcance del pulgar, y la barra de arriba le devuelve el lugar a las solapas -->

    <script>
'use strict';

/**
 * Gráficos en SVG, sin librerías.
 *
 * Colores: verde = ingresos, rojo = gastos (el par está validado para daltonismo
 * con separación en el límite, así que las series siempre llevan además leyenda,
 * posición fija dentro del grupo y 2px de aire entre barras). Azul = costos de
 * auto y quinta, que no son parte del flujo mensual de plata.
 * Las tablas de cada pantalla son la "vista tabla" de los mismos números.
 */
const CHART_COLORS = {
  income: 'var(--chart-income)',
  expense: 'var(--chart-expense)',
  neutral: 'var(--chart-neutral)',
};

const SVG_NS = 'http://www.w3.org/2000/svg';

function svg(tag, attrs = {}, children = []) {
  const node = document.createElementNS(SVG_NS, tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    node.setAttribute(k, v);
  }
  for (const child of [].concat(children)) {
    if (child) node.append(child);
  }
  return node;
}

/** Barra con la punta redondeada y la base cuadrada sobre la línea del cero. */
function columnPath(x, y, w, h, r = 4, down = false) {
  const radius = Math.min(r, w / 2, Math.max(h, 0));
  if (h <= 0.5) return `M${x} ${y}h${w}`;
  if (down) {
    // arranca en la base (y) y crece hacia abajo: redondeo en la punta de abajo
    return `M${x} ${y}v${h - radius}a${radius} ${radius} 0 0 0 ${radius} ${radius}h${w - radius * 2}a${radius} ${radius} 0 0 0 ${radius} -${radius}V${y}Z`;
  }
  return `M${x} ${y + h}V${y + radius}a${radius} ${radius} 0 0 1 ${radius} -${radius}h${w - radius * 2}a${radius} ${radius} 0 0 1 ${radius} ${radius}V${y + h}Z`;
}

/** Escala redondeada a números limpios. Admite valores negativos (línea del cero). */
function niceScale(max, min = 0) {
  const span = Math.max(max, 0) - Math.min(min, 0);
  if (!(span > 0)) return { top: 1, bottom: 0, ticks: [0, 1] };
  const raw = span / 3;
  const magnitude = 10 ** Math.floor(Math.log10(raw));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * magnitude).find((s) => s >= raw) || magnitude * 10;
  const top = Math.ceil(Math.max(max, 0) / step) * step;
  const bottom = -Math.ceil(Math.abs(Math.min(min, 0)) / step) * step;
  const ticks = [];
  for (let v = bottom; v <= top + step / 2; v += step) ticks.push(Math.abs(v) < step / 1000 ? 0 : v);
  return { top, bottom, ticks };
}

const shortMoney = (n) => {
  const abs = Math.abs(n);
  if (abs >= 1e6) return `${n < 0 ? '-' : ''}$${(abs / 1e6).toFixed(abs >= 1e7 ? 0 : 1).replace('.', ',')}M`;
  if (abs >= 1000) return `${n < 0 ? '-' : ''}$${Math.round(abs / 1000)}k`;

/**

function chartColumns({

  const plotH = height - pad.top - pad.bottom;
  const values = series.flatMap((s) => s.values.map((v) => v || 0));
  const { top, bottom, ticks } = niceScale(Math.max(0, ...values), Math.min(0, ...values));
  const span = top - bottom || 1;
  const y = (v) => pad.top + plotH - ((Math.max(bottom, Math.min(top, v || 0)) - bottom) / span) * plotH;

  const peaks = series.map((s) => {

    return best > 0 ? s.values.findIndex((v) => Math.abs(v || 0) === best) : -1;

        document.createTextNode(shortFormat(t)),

  );

    const groupW = series.length * barW + (series.length - 1) * gap;
    const startX = pad.left + slot * i + (slot - groupW) / 2;
    series.forEach((s, si) => {
      const value = s.values[i] || 0;
      const x = startX + si * (barW + gap);
      const negative = value < 0;
      const h = Math.abs(zero - y(value));
      const mark = svg('path', {
        // Los negativos crecen para abajo desde la línea del cero.
        d: negative
          ? columnPath(x, zero, barW, h, 4, true)
          : columnPath(x, y(value), barW, h),
        fill: colorFor ? colorFor(value, i) : s.color,
        class: 'chart-mark' + (onSelect ? ' is-clickable' : '') + (selected === i ? ' is-selected' : ''),
      });
      attachTip(mark, `${label} · ${s.name}: ${format(value)}`);
      if (onSelect) mark.addEventListener('click', () => onSelect(i));
      marks.push(mark);

      // Etiqueta directa sólo en el máximo de cada serie (nunca en todas). Si las dos
      // series pican el mismo mes, cada una se corre hacia afuera del grupo para no
      // pisarse: la etiqueta nunca se recorta ni se superpone.
      if (peaks[si] === i && value !== 0) {
        const text = shortFormat(value);
        const textW = text.length * 6.8; // aproximación suficiente para no pisar los bordes
        const outward = sharedPeak && series.length === 2;
        let anchor = 'middle';
        let labelX = x + barW / 2;
        if (outward) {
          // Las dos series pican el mismo mes: cada etiqueta se corre hacia afuera,
          // y si se saldría del marco se apoya contra el borde del área de dibujo.
          if (si === 0) {
            anchor = 'end';
            labelX = Math.max(startX - 4, pad.left + textW);
          } else {
            anchor = 'start';
            labelX = startX + groupW + 4;
            if (labelX + textW > width - pad.right) {
              anchor = 'end';
              labelX = width - pad.right;
            }
          }
        }
        marks.push(
          svg(
            'text',
            {
              x: labelX,
              y: negative ? y(value) + 14 : y(value) - 6,

      svg(

          y: height - 8,
          class: selected === i ? 'chart-axis is-selected' : 'chart-axis',

        },

    'svg',
    { viewBox: `0 0 ${width} ${height}`, class: 'chart', role: 'img', 'aria-label': title || 'gráfico' },

/** Línea mensual con relleno suave: sirve para acumulados y evoluciones. */
function chartLine({ labels, values, color, width = 460, height = 190, title, note, valueName = 'Acumulado' }) {
  const pad = { top: 20, right: 14, bottom: 26, left: 62 };
  const plotW = width - pad.left - pad.right;
  const plotH = height - pad.top - pad.bottom;
  const { top, bottom, ticks } = niceScale(Math.max(0, ...values), Math.min(0, ...values));
  const span = top - bottom || 1;
  const x = (i) => pad.left + (labels.length === 1 ? plotW / 2 : (plotW * i) / (labels.length - 1));
  const y = (v) => pad.top + plotH - ((v - bottom) / span) * plotH;

  const points = values.map((v, i) => [x(i), y(v || 0)]);
  const line = points.map(([px, py], i) => `${i ? 'L' : 'M'}${px} ${py}`).join(' ');
  const area = `${line} L${points[points.length - 1][0]} ${y(Math.max(0, bottom))} L${points[0][0]} ${y(Math.max(0, bottom))} Z`;

  const gridlines = ticks.map((t) =>
    svg('g', {}, [
      svg('line', { x1: pad.left, x2: width - pad.right, y1: y(t), y2: y(t), class: 'chart-grid-line' }),
      svg('text', { x: pad.left - 8, y: y(t) + 4, class: 'chart-axis', 'text-anchor': 'end' }, [
        document.createTextNode(shortMoney(t)),

    ])

    // El aro del color de la superficie hace de zona de hover y separa el punto de la línea.
    const dot = svg('circle', { cx: x(i), cy: y(v || 0), r: 5, fill: color, class: 'chart-dot' });
    attachTip(dot, `${labels[i]} · ${valueName}: ${money(v || 0)}`);
    return dot;
  });

  const lastIndex = values.length - 1;
  const marks = [
    svg('path', { d: area, fill: color, class: 'chart-area' }),
    svg('path', { d: line, fill: 'none', stroke: color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }),
    ...dots,
    svg(
      'text',
      { x: x(lastIndex), y: y(values[lastIndex] || 0) - 12, class: 'chart-peak', 'text-anchor': 'end' },
      [document.createTextNode(shortMoney(values[lastIndex] || 0))]
    ),
  ];

  const axis = labels.map((label, i) =>
    i % 2 === 0
      ? svg('text', { x: x(i), y: height - 8, class: 'chart-axis', 'text-anchor': 'middle' }, [
          document.createTextNode(label),
        ])
      : null
  );

  const plot = svg(
    'svg',
    { viewBox: `0 0 ${width} ${height}`, class: 'chart', role: 'img', 'aria-label': title || 'gráfico' },
    [...gridlines, ...marks, ...axis.filter(Boolean)]
  );

  return chartFrame({ title, note, plot });
}

  const head = [];
  if (title) head.push(el('h3', { class: 'chart-title', text: title }));
  if (note) head.push(el('span', { class: 'chart-note', text: note }));
  if (series) {

    head.push(
      el(
        'div',
        { class: 'chart-legend' },

    head.length ? el('div', { class: 'chart-head' }, head) : null,

/**
 * Ranking en barras horizontales. Los nombres de categoría son largos y no entran abajo de
 * una columna: acostadas se leen enteras y el orden se ve de arriba hacia abajo.
 *
 * `items` = [{ label, value, color?, onSelect? }]. Con `selected` se marca una.
 */
function chartBars({ items, width = 460, title, note, format = shortMoney, selected = null, onSelect = null }) {
  const alto = 26;
  const anchoEtiqueta = Math.min(150, Math.max(90, width * 0.32));
  const height = Math.max(items.length * alto + 8, 40);
  const max = Math.max(...items.map((i) => Math.abs(i.value)), 1);
  const anchoBarra = width - anchoEtiqueta - 62;

  const plot = svg('svg', { viewBox: `0 0 ${width} ${height}`, class: 'chart', role: 'img', preserveAspectRatio: 'xMidYMid meet' });

  items.forEach((item, i) => {
    const y = i * alto + 4;
    const w = Math.max((Math.abs(item.value) / max) * anchoBarra, 2);
    const color = item.color || CHART_COLORS.expense;
    const grupo = svg('g', {
      class: 'bar-row' + (selected === i ? ' is-selected' : '') + (onSelect ? ' is-clickable' : ''),
    });

    // cualquier lado, no sólo sobre la barra.
    grupo.append(svg('rect', { x: 0, y: y - 2, width, height: alto - 2, class: 'bar-hit', rx: 5 }));
    grupo.append(
      svg('text', { x: 0, y: y + alto / 2 - 2, class: 'bar-label', 'dominant-baseline': 'middle' }, [
        document.createTextNode(item.label),
      ])
    );
    grupo.append(svg('rect', { x: anchoEtiqueta, y: y + 3, width: w, height: alto - 12, rx: 4, fill: color }));
    grupo.append(
      svg('text', { x: anchoEtiqueta + w + 7, y: y + alto / 2 - 2, class: 'bar-value', 'dominant-baseline': 'middle' }, [
        document.createTextNode(format(item.value)),
      ])
    );

    attachTip(grupo, `${item.label}: ${format(item.value)}`);
    if (onSelect) {
      grupo.addEventListener('click', () => onSelect(i, item));
      grupo.setAttribute('tabindex', '0');
      grupo.addEventListener('keydown', (e) => {

}

  return list.reduce((acc, n) => acc + (Number(n) || 0), 0);
}

function amountCell(value, extraClass = '') {
  const n = Number(value) || 0;
  const cls = n < 0 ? 'neg' : n === 0 ? 'zero' : '';
  return el('td', { class: `num ${cls} ${extraClass}`.trim(), text: n === 0 ? '–' : money(n) });
}

/** Marca la columna del mes en curso, para ubicarse de un vistazo. */
const claseMes = (indice) => (indice === mesEnCurso() ? 'mes-actual' : '');

const categoriesOf = (section) => state.data.sections[section]?.categories || [];

// ---------------------------------------------------------------- grilla

function sectionTotals(section) {
  const cats = categoriesOf(section);
  return MONTHS.map((_, m) => sum(cats.map((c) => c.months[m])));
}

function renderSummary() {
  const totals = Object.fromEntries(SECTIONS.map((s) => [s.key, sectionTotals(s.key)]));
  const gasto = MONTHS.map((_, m) => sum(SECCIONES_DE_GASTO.map((key) => totals[key][m])));
  const resto = MONTHS.map((_, m) => totals.ingresos[m] - gasto[m]);
  const hayAhorro = sum(totals.ahorro) !== 0;

  const rows = [
    { label: 'Ingresos', values: totals.ingresos, tab: 'ingresos', tone: 'income', key: true },
    { label: 'Tarjetas', values: totals.tarjetas, tab: 'tarjetas' },
    { label: 'Gastos fijos', values: totals.fijos, tab: 'fijos' },
    { label: 'Gastos variables', values: totals.variables, tab: 'variables' },
    { label: 'Total', values: gasto, strong: true, key: true },
    { label: 'Resto', values: resto, strong: true, key: true },
    { label: 'Ahorros', values: totals.ahorro, tab: 'ahorro', tone: 'aparte' },
  ];

  const ingresosAnio = sum(totals.ingresos);
  const share = (value) =>
    ingresosAnio ? `${((value / ingresosAnio) * 100).toFixed(1).replace('.', ',')}%` : '–';

  const table = el('table', { class: 'summary' }, [
    el('thead', {}, [
      el('tr', {}, [
        el('th', { class: 'col-label', text: 'Resumen' }),
        ...MONTHS.map((m, i) => el('th', { class: claseMes(i), text: m })),
        el('th', { class: 'year-col', text: 'Año' }),
        el('th', { class: 'pct-col', title: 'Sobre el total de ingresos del año', text: '%' }),
      ]),
    ]),
    el(
      'tbody',
      {},
      rows.map((row) =>
        el('tr', { class: `${row.strong ? 'strong ' : ''}${row.key ? 'is-key ' : ''}row-${row.tone || 'expense'}` }, [
          el('td', { class: 'col-label' }, [
            row.tab
              ? el('button', {
                  class: 'row-link',
                  text: row.label,
                  title: `Ver ${row.label}`,
                  onclick: () => setTab(row.tab, 'anio'),
                })
              : el('span', { class: 'row-link is-static', text: row.label }),
          ]),
          ...row.values.map((v, i) => amountCell(v, claseMes(i))),
          amountCell(sum(row.values), 'year-col'),
          el('td', { class: 'num pct-col', text: share(sum(row.values)) }),
        ])
      )
    ),
  ]);

  const charts = el('div', { class: 'chart-grid' }, [
    chartColumns({
      labels: MONTHS,
      series: [
        { name: 'Ingresos', color: CHART_COLORS.income, values: totals.ingresos },
        { name: 'Gasto', color: CHART_COLORS.expense, values: gasto },
      ],
      width: 940,
      title: `Ingresos y gasto mes a mes · ${state.year}`,
      note: 'la etiqueta marca el mes más alto de cada serie',
    }),
    chartColumns({
      labels: MONTHS,
      series: [{ name: 'Resto', color: CHART_COLORS.income, values: resto }],
      width: 460,
      height: 210,
      colorFor: (v) => (v < 0 ? CHART_COLORS.expense : CHART_COLORS.income),
      title: 'Resto por mes',
      note: 'ingresos − gasto',
    }),
    // Lo que antes estaba repartido en cada sección, junto y comparable
    chartColumns({
      labels: MONTHS,
      series: SECTIONS.filter((s) => s.key !== 'ingresos' && s.key !== 'ahorro').map((s, i) => ({
        name: s.title,
        color: TONOS_SECCION[i % TONOS_SECCION.length],
        values: totals[s.key],
      })),
      width: 940,
      height: 210,
      title: 'Gasto por sección',
      note: 'fijos, tarjetas y variables mes a mes',
    }),
    hayAhorro
      ? chartColumns({
          labels: MONTHS,
          series: [{ name: 'Ahorros', color: CHART_COLORS.neutral, values: totals.ahorro }],
          width: 460,
          height: 210,

      el('span', { class: 'spacer' }),
      el('span', { class: 'hint', text: 'clic en el nombre de la fila para ir a esa sección' }),

// Un tono por sección de gasto, para poder compararlas en un mismo gráfico.
const TONOS_SECCION = ['var(--chart-expense)', 'var(--chart-neutral)', 'var(--chart-warm)'];

/**
 * Ranking de gasto por categoría y, al elegir una, por subcategoría.
 *
 * El desglose fino sale de los movimientos: lo que está cargado a mano en la grilla es un
 * monto suelto por mes y no tiene subcategoría, así que aparece como "Sin subcategoría".
 */
function renderDesglose() {
  const categorias = SECCIONES_DE_GASTO.flatMap((key) =>
    categoriesOf(key).map((c) => ({ section: key, name: c.name, total: sum(c.months), subs: c.subs || {} }))
  )
    .filter((c) => c.total !== 0)
    .sort((a, b) => Math.abs(b.total) - Math.abs(a.total));

  if (!categorias.length) return null;

  const elegida = categorias.findIndex(
    (c) => state.desglose && c.section === state.desglose.section && c.name === state.desglose.name
  );

  const graficos = [
    chartBars({
      items: categorias.map((c) => ({ label: c.name, value: c.total })),
      width: 470,
      title: `Gasto por categoría · ${state.year}`,
      note: 'clic para abrir sus subcategorías',
      selected: elegida >= 0 ? elegida : null,
      onSelect: (i, item) => {
        const igual = state.desglose && state.desglose.name === item.label;
        state.desglose = igual ? null : { section: categorias[i].section, name: categorias[i].name };
        renderYear();
      },
    }),
  ];

  const foco = elegida >= 0 ? categorias[elegida] : null;
  if (foco) {
    const subs = Object.keys(foco.subs)
      .map((name) => ({ label: name, value: foco.subs[name] }))
      .sort((a, b) => Math.abs(b.value) - Math.abs(a.value));
    // Lo que no salió de un movimiento no está en subs: se muestra como el resto de la celda
    const enMovimientos = subs.reduce((t, s) => t + s.value, 0);
    const enGrilla = foco.total - enMovimientos;
    if (Math.round(enGrilla) !== 0) subs.push({ label: 'Cargado en la grilla', value: enGrilla });

    graficos.push(
      chartBars({
        items: subs.sort((a, b) => Math.abs(b.value) - Math.abs(a.value)),
        width: 470,
        title: `${foco.name} por subcategoría`,
        note: subs.length ? 'clic de nuevo en la categoría para cerrar' : 'esta categoría no tiene subcategorías',
      })
    );
  }

  return el('div', { class: 'chart-grid' }, graficos);
}

function findCategory(section, name) {
  return categoriesOf(section).find((c) => c.name === name);
}

/** Celda editable: escribe el monto cargado a mano en la grilla. */
function cellInput(section, category, monthIndex, value) {
  const input = el('input', {
    class: 'cell-input' + (value === null || value === undefined ? ' is-empty' : ''),
    type: 'text',
    inputmode: 'decimal',
    value: value === null || value === undefined ? '' : money(value),
    dataset: { section, category, month: String(monthIndex + 1) },
  });

  input.addEventListener('focus', () => {
    const cat = findCategory(section, category);
    if (!cat) return; // la grilla cambió abajo del input: no lo tocamos
    const raw = cat.base[monthIndex];
    input.value = raw === null || raw === undefined ? '' : String(raw);
    input.classList.remove('is-empty');
    input.select();
  });

  input.addEventListener('blur', async () => {
    // Un input que ya salió del DOM (por un re-render) no puede guardar nada: si no,
    // un cambio de solapa mientras editás termina borrando la celda.
    const cat = findCategory(section, category);
    if (!input.isConnected || !cat) return;
    const parsed = parseNumber(input.value);
    const previous = cat.base[monthIndex];
    if (parsed === previous) {
      input.value = previous === null || previous === undefined ? '' : money(previous);
      input.classList.toggle('is-empty', previous === null || previous === undefined);
      return;
    }
    try {
      await apiMutar('PUT', '/api/cell', {
        year: state.year,
        section,
        category,
        month: monthIndex + 1,
        amount: parsed,
      });
      await loadYear(state.year);
    } catch (err) {
      toast(err.message, true);
      input.value = previous === null || previous === undefined ? '' : money(previous);
    }
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      input.blur();
    }
  });

  return input;
}

/** Celda con movimientos: muestra el total y abre el detalle. */
function cellDetail(section, category, monthIndex, cat) {
  const total = cat.months[monthIndex];
  const pending = cat.pending[monthIndex];
  const header = `${cat.moves[monthIndex]} movimiento(s)${pending ? ` · ${money(pending)} sin pagar` : ''}`;
  const button = el(
    'button',
    {
      class: 'cell-detail' + (Number(total) < 0 ? ' neg' : ''),
      title: [header, ...(cat.tips?.[monthIndex] || [])].join('\n'),
      onclick: async () => {
        state.month = monthIndex + 1;
        state.filter = { section, category };
        state.tabs.anio = 'movimientos';
        almacen.escribir('solapa-anio', 'movimientos');
        await refreshMovements();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },
    },
    [
      el('span', { text: total ? money(total) : '–' }),
      pending ? el('span', { class: 'pending-dot', text: '•' }) : null,
    ]
  );
  return button;
}

function renderSection({ key, title, hint, ordenarPorMonto }) {
  // En gastos variables interesa ver primero lo que más pesa en el año.
  const categories = ordenarPorMonto
    ? [...categoriesOf(key)].sort((a, b) => sum(b.months) - sum(a.months))
    : categoriesOf(key);

  const body = el(
    'tbody',
    {},
    categories.map((cat) =>
      el('tr', {}, [
        el('td', { class: 'col-label' }, [
          el('div', { class: 'label-cell' }, [
            categoryNameInput(key, cat.name),
            el('div', { class: 'row-actions' }, [
              ordenarPorMonto
                ? null
                : el('button', { class: 'icon-btn', title: 'Subir', text: '↑', onclick: () => moveCategory(key, cat.name, 'up') }),
              ordenarPorMonto
                ? null
                : el('button', { class: 'icon-btn', title: 'Bajar', text: '↓', onclick: () => moveCategory(key, cat.name, 'down') }),
              el('button', { class: 'icon-btn', title: 'Mover a otra sección', text: '⇄', onclick: () => moveCategoryToSection(key, cat.name) }),
              el('button', { class: 'icon-btn', title: 'Pasar los montos de la grilla a movimientos', text: '⇣', onclick: () => cellsToMovements(key, cat.name) }),
              el('button', { class: 'icon-btn danger', title: 'Borrar categoría', text: '✕', onclick: () => removeCategory(key, cat.name) }),
            ]),
          ]),
        ]),
        ...MONTHS.map((_, m) =>
          el('td', { class: claseMes(m) }, [
            cat.moves[m] > 0 ? cellDetail(key, cat.name, m, cat) : cellInput(key, cat.name, m, cat.months[m]),
          ])
        ),
        amountCell(sum(cat.months), 'year-col'),
      ])
    )
  );

  const totals = sectionTotals(key);

  const addInput = el('input', { class: 'add-input', type: 'text', placeholder: '+ nueva categoría' });
  addInput.addEventListener('keydown', async (e) => {
    if (e.key !== 'Enter' || !addInput.value.trim()) return;
    try {
      await apiMutar('POST', '/api/category', { year: state.year, section: key, name: addInput.value.trim() });
    } catch (err) {
      toast(err.message, true);
    }
  });

  return el('section', { class: 'panel' }, [
    el('div', { class: 'panel-head' }, [el('h2', { text: title }), el('span', { class: 'hint', text: hint })]),
    sectionInsights(key, title),
    el('div', { class: 'scroll-x' }, [
      el('table', {}, [
        el('thead', {}, [
          el('tr', {}, [
            el('th', { class: 'col-label', text: 'Categoría' }),
            ...MONTHS.map((m, i) => el('th', { class: claseMes(i), text: m })),
            el('th', { class: 'year-col', text: 'Año' }),
          ]),
        ]),
        body,
        el('tfoot', {}, [
          el('tr', {}, [
            el('td', { class: 'col-label', text: 'Total' }),
            ...totals.map((t, i) => amountCell(t, claseMes(i))),
            amountCell(sum(totals), 'year-col'),
          ]),
          el('tr', { class: 'add-row' }, [el('td', { colspan: String(MONTHS.length + 2) }, [addInput])]),
        ]),
      ]),
    ]),
  ]);
}

/** Los números de una sección. Los gráficos están todos en Resumen. */
function sectionInsights(key, title) {
  const cats = categoriesOf(key);
  const totals = sectionTotals(key);
  const yearTotal = sum(totals);
  const withData = totals.filter((t) => t !== 0);
  const peak = totals.indexOf(Math.max(...totals));

  const ranking = cats
    .map((c) => ({ label: c.name, value: sum(c.months) }))
    .filter((r) => r.value !== 0)
    .sort((a, b) => Math.abs(b.value) - Math.abs(a.value));

  const stats = statRow([
    { label: 'Total del año', value: money(yearTotal) },
    {
      label: 'Promedio mensual',
      value: money(withData.length ? Math.round(yearTotal / withData.length) : 0),
      sub: `${withData.length} mes(es) con datos`,
    },
    yearTotal ? { label: 'Mes más alto', value: MONTHS[peak], sub: money(totals[peak]) } : null,
    ranking.length ? { label: 'Categoría más alta', value: ranking[0].label, sub: money(ranking[0].value) } : null,
  ]);

  // Los gráficos viven todos en Resumen: acá quedan los números, que son los que se miran
  // sin levantar la vista de la tabla.
  return stats;
}

function categoryNameInput(section, name) {
  const input = el('input', { class: 'label-input', type: 'text', value: name });
  input.addEventListener('blur', async () => {
    const to = input.value.trim();
    if (!to || to === name) {
      input.value = name;
      return;
    }
    try {
      await apiMutar('PATCH', '/api/category', { year: state.year, section, from: name, to });
    } catch (err) {
      toast(err.message, true);
      input.value = name;
    }
  });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') input.blur();
  });
  return input;
}

async function moveCategory(section, name, direction) {
  try {
    await apiMutar('PATCH', '/api/category', { year: state.year, section, name, direction });
  } catch (err) {
    toast(err.message, true);
  }
}

/**
 * Un modal chico para lo que no se resuelve con un confirm(): elegir una sección, repartir
 * subcategorías. Devuelve lo que arme `leer()`, o null si cancelaste.
 */
function dialogo({ titulo, hint, contenido, aceptar = 'Aplicar', leer = () => true }) {
  return new Promise((resolve) => {
    const dlg = el('dialog', { class: 'dialogo' }, [
      el('form', { method: 'dialog' }, [
        el('h2', { class: 'dialogo-titulo', text: titulo }),
        hint ? el('p', { class: 'dialogo-hint', text: hint }) : null,
        el('div', { class: 'dialogo-cuerpo' }, contenido),
        el('div', { class: 'dialogo-pie' }, [
          el('button', { class: 'btn btn-ghost', type: 'button', text: 'Cancelar', onclick: () => { dlg.close(); resolve(null); } }),
          el('button', { class: 'btn btn-accent', type: 'button', text: aceptar, onclick: () => { const v = leer(); dlg.close(); resolve(v); } }),
        ]),
      ]),
    ]);
    dlg.addEventListener('close', () => dlg.remove());
    dlg.addEventListener('cancel', () => resolve(null));
    document.body.append(dlg);
    dlg.showModal();
  });
}

async function moveCategoryToSection(section, name) {
  const opciones = SECTIONS.filter((s) => s.key !== section);
  const select = el('select', { class: 'field-input' }, opciones.map((s) => el('option', { value: s.key, text: s.title })));
  const elegida = await dialogo({
    titulo: `Mover "${name}"`,
    hint: 'Se lleva sus celdas y movimientos, de todos los años. Los totales de cada sección cambian.',
    contenido: [el('label', { class: 'field' }, [el('span', { text: 'A la sección' }), select])],
    aceptar: 'Mover',
    leer: () => select.value,
  });
  if (!elegida) return;
  try {
    await apiMutar('POST', '/api/category/move', { section, name, toSection: elegida });
    toast('Movida');
  } catch (err) {
    toast(err.message, true);
  }
}

/** Pasa las celdas de una categoría a movimientos, con una subcategoría por mes. */
async function cellsToMovements(section, category) {
  const cat = findCategory(section, category);
  const meses = MONTHS.map((_, i) => i).filter((i) => cat && cat.base[i] !== null && cat.base[i] !== 0);
  if (!meses.length) {
    toast('Esta categoría no tiene montos cargados a mano en este año', true);
    return;
  }
  const porDefecto = el('input', { class: 'field-input', type: 'text', placeholder: 'Sueldo' });
  const campos = meses.map((i) =>
    el('label', { class: 'field field-fila' }, [
      el('span', { text: `${MONTHS[i]} · ${money(cat.base[i])}` }),
      el('input', { class: 'field-input', type: 'text', dataset: { mes: String(i + 1) }, placeholder: 'igual que arriba' }),
    ])
  );
  const plan = await dialogo({
    titulo: `Pasar "${category}" a movimientos`,
    hint: `${state.year}: ${meses.length} mes(es). El total de cada mes no cambia; lo que gana es que ahora podés etiquetar cada uno.`,
    contenido: [
      el('label', { class: 'field' }, [el('span', { text: 'Subcategoría para todos' }), porDefecto]),
      ...campos,
    ],
    aceptar: 'Convertir',
    leer: () => ({
      subcategory: porDefecto.value.trim(),
      filas: campos.map((f) => {
        const input = f.querySelector('input');
        return { year: state.year, month: Number(input.dataset.mes), subcategory: input.value.trim() };
      }),
    }),
  });
  if (!plan) return;
  if (!plan.subcategory && plan.filas.every((f) => !f.subcategory)) {
    toast('Poné al menos una subcategoría', true);
    return;
  }
  try {
    const r = await apiMutar('POST', '/api/cells-to-movements', { section, category, ...plan });
    toast(`${r.movimientos} movimiento(s)`);
  } catch (err) {
    toast(err.message, true);
  }
}

async function removeCategory(section, name) {
  const cat = findCategory(section, name);
  const moves = cat ? sum(cat.moves) : 0;
  const extra = moves ? ` y sus ${moves} movimiento(s)` : '';
  if (!confirm(`¿Borrar "${name}"${extra} de ${state.year}?`)) return;
  try {
    await apiMutar('DELETE', '/api/category', { year: state.year, section, name });
  } catch (err) {
    toast(err.message, true);
  }
}

/**
 * Qué hay para sanear, mirando todos los años juntos. Sólo mira: no cambia nada.
 *
 * El resto de la app trabaja de a un año, así que sola no puede ver que "INTERNET" de 2022
 * y "Internet" de 2025 son la misma cosa. El informe lo arma la lógica compartida.
 */
let pidiendoRevision = false;

async function cargarRevision() {
  if (pidiendoRevision) return;
  pidiendoRevision = true;
  try {
    state.revision = await api('GET', '/api/revision');
    renderYear();
  } catch (err) {
    toast(err.message, true);
  } finally {
    pidiendoRevision = false;
  }
}

/** Mete todas las variantes de un grupo adentro de la que elegiste. */
async function fusionarGrupo(grupo, gana) {
  const pierden = grupo.options.filter((o) => o !== gana);
  const otras = pierden.map((o) => `"${o.name}"`).join(' y ');
  if (!confirm(`¿Fusionar ${otras} adentro de "${gana.name}"?\n\nSe llevan sus celdas y movimientos de todos los años. Los totales de cada mes no cambian.`)) return;
  try {
    for (const o of pierden) {
      // Si quedó en otra sección, primero se acomoda: la fusión trabaja adentro de una sola
      if (o.section !== gana.section) {
        await api('POST', '/api/category/move', { section: o.section, name: o.name, toSection: gana.section });
      }
      await api('POST', '/api/category/merge', { section: gana.section, from: o.name, to: gana.name });
    }
    await refreshAll();
    toast(`Quedó "${gana.name}"`);
  } catch (err) {
    toast(err.message, true);
  }
}

async function borrarSubcategorias(section, category, name) {
  const que = name ? `la subcategoría "${name}"` : `las ${'subcategorías'} de "${category}"`;
  if (!confirm(`¿Borrar ${que}?\n\nSólo se va del catálogo: los movimientos no se tocan.`)) return;
  try {
    const r = await apiMutar('DELETE', '/api/subcategory', { section, category, name });
    toast(`${r.borradas} borrada(s)`);
  } catch (err) {
    toast(err.message, true);
  }
}

function bloqueRevision(titulo, pista, filas, { tono = '' } = {}) {
  if (!filas.length) return null;
  return el('section', { class: `panel ${tono}`.trim() }, [
    el('div', { class: 'panel-head' }, [
      el('h2', { text: titulo }),
      el('span', { class: 'hint', text: pista }),
    ]),
    el('div', { class: 'scroll-x' }, [el('table', {}, [el('tbody', {}, filas)])]),
  ]);
}

function renderRevision() {
  if (!state.revision) {
    cargarRevision();
    return el('section', { class: 'panel' }, [
      el('div', { class: 'panel-head' }, [el('h2', { text: 'Revisión' }), el('span', { class: 'hint', text: 'Mirando todos los años…' })]),
    ]);
  }

  const { parecidas, huerfanas, sinUso, vacias, sinClasificar } = state.revision;
  const bloques = [];

  // Un grupo por nombre repetido, con una fila por variante: así se ve de un vistazo cuál
  // conviene conservar (la que tiene más años y más movimientos).
  bloques.push(
    bloqueRevision(
      'Nombres repetidos',
      `${parecidas.length} grupo(s) · el mismo concepto escrito de dos maneras`,
      parecidas.flatMap((grupo) =>
        grupo.options.map((o, i) =>
          el('tr', { class: i === 0 ? 'grupo-primero' : '' }, [
            el('td', { class: 'col-label' }, [el('span', { class: 'plain-label', text: i === 0 ? o.section : '' })]),
            el('td', { style: 'text-align:left' }, [el('span', { class: 'plain-label', text: o.name })]),
            el('td', { style: 'text-align:left' }, [el('span', { class: 'plain-label', text: o.years.join(', ') })]),
            el('td', { class: 'num', text: `${o.celdas + o.movs} uso(s)` }),
            amountCell(o.total),
            el('td', { class: 'num' }, [
              // Fusionar el resto del grupo adentro de esta: se elige la que queda, no la
              // que se va, que es como uno lo piensa.
              grupo.options.length > 1
                ? el('button', {
                    class: 'btn btn-small',
                    text: 'Dejar sólo esta',
                    title: `Fusionar ${grupo.options.filter((x) => x !== o).map((x) => `"${x.name}"`).join(' y ')} adentro de "${o.name}"`,
                    onclick: () => fusionarGrupo(grupo, o),
                  })
                : null,
            ]),
          ])
        )
      )
    )
  );

  // Agrupadas por la categoría que no existe: son 100 y pico y todas dicen lo mismo.
  const porCategoria = {};
  huerfanas.forEach((h) => {
    const k = `${h.section}|${h.category}`;
    (porCategoria[k] = porCategoria[k] || []).push(h.name);
  });
  bloques.push(
    bloqueRevision(
      'Subcategorías huérfanas',
      `${huerfanas.length} · cuelgan de una categoría que no existe, no las ve nadie`,
      Object.keys(porCategoria).map((k) => {
        const nombres = porCategoria[k];
        return el('tr', { title: nombres.join(' · ') }, [
          el('td', { class: 'col-label' }, [el('span', { class: 'plain-label', text: k.split('|')[0] })]),
          el('td', { style: 'text-align:left' }, [el('span', { class: 'plain-label', text: k.split('|')[1] })]),
          el('td', { style: 'text-align:left' }, [
            el('span', { class: 'plain-label has-note', text: nombres.slice(0, 4).join(', ') + (nombres.length > 4 ? '…' : '') }),
          ]),
          el('td', { class: 'num', text: `${nombres.length}` }),
          el('td', { class: 'num' }, [
            el('button', {
              class: 'btn btn-small',
              text: 'Borrar todas',
              onclick: () => borrarSubcategorias(k.split('|')[0], k.split('|')[1]),
            }),
          ]),
        ]);
      })
    )
  );

  bloques.push(
    bloqueRevision(
      'Subcategorías sin uso',
      `${sinUso.length} · están en el catálogo pero ningún movimiento las usa`,
      sinUso.map((s) =>
        el('tr', {}, [
          el('td', { class: 'col-label' }, [el('span', { class: 'plain-label', text: s.section })]),
          el('td', { style: 'text-align:left' }, [el('span', { class: 'plain-label', text: s.category })]),
          el('td', { style: 'text-align:left' }, [el('span', { class: 'plain-label', text: s.name })]),
          el('td', { class: 'num' }, [
            el('button', { class: 'btn btn-small', text: 'Borrar', onclick: () => borrarSubcategorias(s.section, s.category, s.name) }),
          ]),
        ])
      )
    )
  );

  bloques.push(
    bloqueRevision(
      'Categorías vacías',
      `${vacias.length} · declaradas, sin una sola celda ni movimiento`,
      vacias.map((v) =>
        el('tr', {}, [
          el('td', { class: 'col-label' }, [el('span', { class: 'plain-label', text: v.section })]),
          el('td', { style: 'text-align:left' }, [el('span', { class: 'plain-label', text: v.name })]),
          el('td', { style: 'text-align:left' }, [el('span', { class: 'plain-label', text: v.years.join(', ') })]),
          el('td', { class: 'num' }, [
            // No tiene nada adentro: se puede borrar sin preguntar por los movimientos
            el('button', {
              class: 'btn btn-small',
              text: 'Borrar',
              onclick: async () => {
                try {
                  for (const anio of v.years) {
                    await api('DELETE', '/api/category', { year: anio, section: v.section, name: v.name });
                  }
                  await refreshAll();
                  toast('Borrada');
                } catch (err) {
                  toast(err.message, true);
                }
              },
            }),
          ]),
        ])
      )
    )
  );

  // 2022-2024 está así a propósito: el sheet viejo marcaba la categoría con el color de la
  // celda y eso no se recuperó. Lo reciente sí se puede acomodar a mano.
  bloques.push(
    bloqueRevision(
      'Sin clasificar',
      'los años viejos están así a propósito; lo reciente se puede acomodar',
      sinClasificar.map((s) =>
        el('tr', {}, [
          el('td', { class: 'col-label' }, [el('span', { class: 'plain-label', text: String(s.year) })]),
          el('td', { style: 'text-align:left' }, [
            el('span', { class: 'plain-label', text: s.year >= 2025 ? 'se puede acomodar a mano' : 'no se puede recuperar (venía por color de celda)' }),
          ]),
          el('td', { class: 'num', text: `${s.movs} movimiento(s)` }),
        ])
      )
    )
  );

  const hay = bloques.filter(Boolean);
  if (!hay.length) {
    return el('section', { class: 'panel' }, [
      el('div', { class: 'panel-head' }, [
        el('h2', { text: 'Revisión' }),
        el('span', { class: 'hint', text: 'No encontré nada para revisar.' }),
      ]),
    ]);
  }
  return el('div', {}, hay);
}

// ---------------------------------------------------------------- movimientos del mes

let movementsCache = { key: null, list: [] };

async function loadMovements() {
  const params = new URLSearchParams({ year: String(state.year), month: String(state.month) });
  if (state.filter) {
    params.set('section', state.filter.section);
    params.set('category', state.filter.category);
  }
  const key = params.toString();
  const { movements } = await api('GET', `/api/movements?${key}`);
  movementsCache = { key, list: movements };
  return movements;
}

function renderMovements() {
  const month = state.month;
  const filter = state.filter;

  const chips = MONTHS.map((label, i) =>
    el(
      'button',
      {
        class: 'month-chip' + (i + 1 === month ? ' is-active' : ''),
        onclick: async () => {
          state.month = i + 1;
          await refreshMovements();
        },
      },
      [el('span', { text: label })]
    )
  );

  const list = movementsCache.list;

  const rows = list.map((mov) => {
    const day = el('input', { class: 'day-input', type: 'text', inputmode: 'numeric', value: mov.day ?? '', placeholder: '–' });
    day.addEventListener('blur', () => saveMovement(mov, { day: parseNumber(day.value) }));

    const category = el('select', { class: 'row-select' }, categoryOptions(mov.kind, `${mov.section}|${mov.category}`));
    category.addEventListener('change', () => {
      const [section, cat] = category.value.split('|');
      saveMovement(mov, { section, category: cat });
    });

    const sub = el('input', {
      class: 'desc-input',
      type: 'text',
      value: mov.subcategory,
      placeholder: 'subcategoría',
    });
    sub.addEventListener('blur', () => saveMovement(mov, { subcategory: sub.value.trim() }));

    // La descripción es una columna más: antes estaba escondida detrás de un ✎ y sólo se
    // veía pasando el mouse, que en el teléfono no existe.
    const note = el('input', {
      class: 'desc-input',
      type: 'text',
      value: mov.description,
      placeholder: '—',
      title: mov.description || '',
    });
    note.addEventListener('blur', () => {
      if (note.value.trim() === mov.description) return;
      saveMovement(mov, { description: note.value.trim() });
    });

    const amount = el('input', { class: 'cell-input', type: 'text', inputmode: 'decimal', value: money(mov.amount) });
    amount.addEventListener('focus', () => {
      amount.value = String(mov.amount);
      amount.select();
    });
    amount.addEventListener('blur', () => {
      const parsed = parseNumber(amount.value);
      if (parsed === null) {
        amount.value = money(mov.amount);
        return;
      }
      saveMovement(mov, { amount: parsed });
    });

    const paid = el('input', { type: 'checkbox', checked: mov.paid ? true : false, title: 'Pagado' });
    paid.addEventListener('change', () => saveMovement(mov, { paid: paid.checked }));

    for (const input of [day, sub, note, amount]) {
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') input.blur();
      });
    }

    return el('tr', { class: mov.paid ? '' : 'is-pending' }, [
      el('td', {}, [day]),
      el('td', { style: 'text-align:left' }, [category]),
      el('td', { style: 'text-align:left' }, [sub]),
      el('td', { style: 'text-align:left' }, [note]),
      el('td', {}, [amount]),
      el('td', { class: 'num' }, [paid]),
      el('td', { class: 'num actions-cell' }, [
        el('button', {
          class: 'icon-btn danger',
          text: '✕',
          title: 'Borrar',
          onclick: async () => {
            await apiMutar('DELETE', `/api/movements/${mov.id}`);
          },
        }),
      ]),
    ]);
  });

  const head = [
    el('h2', { text: 'Movimientos' }),
    el('span', { class: 'hint', text: filter ? '' : 'lo cargado por formulario' }),
  ];
  if (filter) {
    head.push(
      el('button', {
        class: 'filter-chip',
        text: `${SECTION_TITLE[filter.section]} · ${filter.category} ✕`,
        title: 'Quitar el filtro',
        onclick: async () => {
          state.filter = null;
          await refreshMovements();
        },
      })
    );
  }
  head.push(el('span', { class: 'spacer' }));
  head.push(
    el('button', {
      class: 'btn btn-accent',
      text: '+ Cargar',
      onclick: () => openForm('gasto'),
    })
  );

  const base = filter ? findCategory(filter.section, filter.category)?.base[month - 1] : null;
  const baseRow = filter
    ? el('div', { class: 'base-row' }, [
        el('span', { class: 'hint', text: 'Monto cargado a mano en la grilla:' }),
        (() => {
          const input = el('input', { class: 'add-input', type: 'text', inputmode: 'decimal', value: base === null || base === undefined ? '' : money(base), style: 'width:140px' });
          input.addEventListener('focus', () => {
            input.value = base === null || base === undefined ? '' : String(base);
            input.select();
          });
          input.addEventListener('blur', async () => {
            const parsed = parseNumber(input.value);
            if (parsed === base) return;
            await apiMutar('PUT', '/api/cell', {
              year: state.year,
              section: filter.section,
              category: filter.category,
              month,
              amount: parsed,
            });
          });
          input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') input.blur();
          });
          return input;
        })(),
        el('span', { class: 'hint', text: '(los movimientos de abajo se suman a este monto)' }),
      ])
    : null;

  const total = sum(list.filter((m) => m.paid).map((m) => m.amount));
  const pendingTotal = sum(list.filter((m) => !m.paid).map((m) => m.amount));

  return el('section', { class: 'panel', id: 'movimientos' }, [
    el('div', { class: 'panel-head' }, head),
    el('div', { class: 'months' }, chips),
    baseRow,
    movementInsights(list, month),
    list.length
      ? el('div', { class: 'scroll-x' }, [
          el('table', { class: 'mov-table' }, [
            el('thead', {}, [
              el('tr', {}, [
                el('th', { text: 'Día' }),
                el('th', { style: 'text-align:left', text: 'Categoría' }),
                el('th', { style: 'text-align:left', text: 'Subcategoría' }),
                el('th', { style: 'text-align:left', text: 'Descripción' }),
                el('th', { text: 'Importe' }),
                el('th', { text: 'Pago' }),
                el('th', { text: '' }),
              ]),
            ]),
            el('tbody', {}, rows),
            el('tfoot', {}, [
              el('tr', {}, [
                el('td', { class: 'col-label', text: 'Total' }),
                el('td', {}),
                el('td', { style: 'text-align:left' }, [
                  pendingTotal ? el('span', { class: 'hint', text: `+ ${money(pendingTotal)} sin pagar` }) : null,
                ]),
                el('td', {}),
                amountCell(total),
                el('td', {}),
                el('td', {}),
              ]),
            ]),
          ]),
        ])
      : el('p', { class: 'empty', text: filter ? 'Esta celda no tiene movimientos en el mes.' : 'Todavía no cargaste movimientos en este mes.' }),
  ]);
}

/** Los números del mes que estás mirando en Movimientos. */
function movementInsights(list, month) {
  if (!list.length) return null;
  const paid = list.filter((m) => m.paid);
  const total = sum(paid.map((m) => m.amount));
  const pending = list.filter((m) => !m.paid);
  const biggest = [...list].sort((a, b) => Math.abs(b.amount) - Math.abs(a.amount))[0];

  // Los gráficos viven todos en Resumen: acá quedan los números del mes que estás mirando.
  return statRow([
    { label: `Total ${MONTHS[month - 1]}`, value: money(total), sub: `${paid.length} movimiento(s)` },
    { label: 'Promedio', value: money(paid.length ? Math.round(total / paid.length) : 0) },
    biggest ? { label: 'El más grande', value: money(biggest.amount), sub: biggest.subcategory || biggest.category } : null,
    pending.length
      ? { label: 'Sin pagar', value: money(sum(pending.map((m) => m.amount))), sub: `${pending.length} movimiento(s)`, tone: 'pending' }
      : null,
  ]);
}

async function saveMovement(mov, patch) {
  try {
    await apiMutar('PUT', `/api/movements/${mov.id}`, patch);
    Object.assign(mov, patch);
  } catch (err) {
    toast(err.message, true);
  }
}

/**
 * Opciones del selector de categoría: primero las que el año ya usa (en el orden de la
 * grilla) y después las de otros años, que se crean solas al guardar el movimiento.
 */
function categoryOptions(kind, selectedValue) {
  const groups = [];
  for (const section of FORM_ORDER[kind] || FORM_ORDER.gasto) {
    const own = categoriesOf(section).map((c) => c.name);
    // Si la sección tiene una lista de categorías en uso, se ofrece sólo esa: las viejas
    // siguen existiendo en la grilla pero no ensucian el formulario.
    const activas = CATEGORIAS_PARA_CARGAR[section];
    const names = activas
      ? activas.slice()
      : [...own, ...(state.catalog[section] || []).filter((name) => !own.includes(name))];
    if (!names.length) continue;
    groups.push(
      el(
        'optgroup',
        { label: SECTION_TITLE[section] },
        names.map((name) =>
          el('option', {
            value: `${section}|${name}`,
            text: own.includes(name) ? name : `${name} ·`,
            selected: `${section}|${name}` === selectedValue,
          })
        )
      )
    );
  }
  return groups;
}

function subcategoriesFor(section, category) {
  return state.subcategories
    .filter((s) => s.section === section && s.category === category)
    .map((s) => s.name);
}

  const extras = form.dialog.querySelector('#form-extras');

}

  const actualizarSerie = () => {
